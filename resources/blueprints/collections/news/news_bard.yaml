title: 'News Bard'
sections:
  main:
    display: Main
    fields:
      -
        handle: title
        field:
          type: text
          required: true
          validate:
            - required
      -
        handle: bard_content
        field:
          collapse: false
          always_show_set_button: false
          previews: true
          smart_typography: false
          buttons:
            - h2
            - h3
            - bold
            - italic
            - unorderedlist
            - orderedlist
            - removeformat
            - quote
            - anchor
            - image
            - table
            - code
          save_html: false
          inline: false
          toolbar_mode: fixed
          link_noopener: false
          link_noreferrer: false
          target_blank: false
          reading_time: false
          fullscreen: true
          allow_source: true
          enable_input_rules: true
          enable_paste_rules: true
          antlers: false
          remove_empty_nodes: false
          display: Content
          type: bard
          icon: bard
          listable: hidden
          instructions_position: above
          visibility: visible
          sets:
            audio:
              display: Audio
              fields:
                -
                  handle: audio_file
                  field:
                    mode: list
                    container: assets
                    restrict: false
                    allow_uploads: true
                    show_filename: true
                    display: 'Audio file'
                    type: assets
                    icon: assets
                    listable: hidden
                    instructions_position: above
                    visibility: visible
                    folder: audio
            video:
              display: Youtube
              fields:
                -
                  handle: video
                  field:
                    display: Video
                    type: video
                    icon: video
                    listable: hidden
                    instructions_position: above
                    visibility: visible
            image:
              display: Image
              fields:
                -
                  handle: image
                  field:
                    mode: list
                    container: assets
                    restrict: false
                    allow_uploads: true
                    show_filename: true
                    display: Image
                    type: assets
                    icon: assets
                    listable: hidden
                    instructions_position: above
                    visibility: visible
                    max_files: 1
                -
                  handle: sponsor_logo
                  field:
                    mode: list
                    container: assets
                    folder: sponsors
                    restrict: false
                    allow_uploads: false
                    show_filename: true
                    display: 'Sponsor logo'
                    type: assets
                    icon: assets
                    listable: hidden
                    instructions_position: above
                    visibility: visible
            local_video:
              display: 'Local Video'
              fields:
                -
                  handle: local_video
                  field:
                    mode: list
                    container: assets
                    restrict: false
                    allow_uploads: true
                    show_filename: true
                    display: 'Local Video'
                    type: assets
                    icon: assets
                    listable: hidden
                    instructions_position: above
                    visibility: visible
            gallery:
              display: Gallery
              fields:
                -
                  handle: gallery_images
                  field:
                    mode: list
                    container: assets
                    restrict: false
                    allow_uploads: true
                    show_filename: true
                    display: 'Gallery Images'
                    type: assets
                    icon: assets
                    listable: hidden
                    instructions_position: above
                    visibility: visible
            endurain_activity:
              display: 'Endurain activity'
              instructions: 'A button linking to a public activity on the Endurain logbook.'
              icon: link
              fields:
                -
                  import: endurain_activity
      -
        handle: excerpt
        field:
          antlers: false
          display: Excerpt
          type: textarea
          icon: textarea
          listable: hidden
          instructions_position: above
          visibility: visible
      -
        handle: author
        field:
          mode: select
          display: Author
          type: users
          icon: users
          listable: hidden
          instructions_position: above
          visibility: visible
  sidebar:
    display: Sidebar
    fields:
      -
        handle: slug
        field:
          type: slug
          localizable: true
          validate:
            - 'new \Statamic\Rules\UniqueEntryValue({collection}, {id}, {site})'
      -
        handle: date
        field:
          type: date
          required: true
          validate:
            - required
      -
        handle: featured_image
        field:
          mode: list
          container: assets
          restrict: false
          allow_uploads: true
          show_filename: true
          display: 'Featured Image'
          type: assets
          icon: assets
          listable: hidden
          instructions_position: above
          visibility: visible
      -
        handle: endurain_activity
        field:
          type: group
          display: 'Endurain activity'
          instructions: 'Optional. Shows a logbook button below the post.'
          instructions_position: above
          listable: hidden
          fullscreen: false
          fields:
            # Same fields as the endurain_activity fieldset, but the URL is
            # optional here because not every post has an activity.
            -
              handle: activity_url
              field: endurain_activity.activity_url
              config:
                required: false
                validate:
                  - 'new \App\Rules\EndurainUrl'
            -
              handle: label
              field: endurain_activity.label
            -
              handle: activity_type
              field: endurain_activity.activity_type
            -
              handle: new_tab
              field: endurain_activity.new_tab
